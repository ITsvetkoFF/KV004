<a href="#/map" class="close" ng-click="hideDiv()">×</a>
<form class="editor">
<div class="editor_horizontal">
	<div class="editor_left">
		<label >Заголовок ресурсу: </label>
		<input type="text" ng-model="Title" required>
	</div>
	<div class="editor_right">
		<label>Alias для ресурсу: </label>
		<input type="text" ng-model="Alias" required ng-pattern="/^[0-9a-zA-Z\-\/_?:.,\s]+$/g">
	</div>
</div>
<div class="editor_horizontal">
	<div text-angular="text-angular" name="htmlcontent" ng-model="Content" class="editor_ta"></div>
</div>
<!--<label><input type="radio" ng-model="IsResource" value="0" checked="!IsResource">У шапці</label>
<label><input type="radio" ng-model="IsResource" value="1" checked="IsResource"> В ресурсах</label>-->
<div class="editor_horizontal">
	<div class="editor_left">
		<label>Де розмістити цей ресурс: </label>
				<select ng-model="IsResource">
					<option value="0" selected="!IsResource">У верхньому меню</option>
					<option value="1" selected="IsResource">В розділі "Ресурси"</option>
				</select>
	</div>
	<div class="editor_right">
		<button type="submit" class="b-form__button editor_btn" type="submit" ng-click="sendResource(Alias, Content, Title, IsResource, Id)">Відправити</button>
	</div>
</div>
</form>
